# Commit coordinated SOURCE metadata only. No tag, release, or automatic Build.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: validate, bump and push source metadata
        env:
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_REF" != refs/heads/* ]]; then
            echo "::error::Select a branch, not a tag, for Bump version"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/lifecycle.py bump \
            --branch "${SELECTED_REF#refs/heads/}" --sha "$SELECTED_SHA" --mode "$MODE"
          VERSION=$(python3 .github/scripts/lifecycle.py version)
          echo "### Source version is now ${VERSION}. No tag or release was created. Run Build separately on this branch when ready." >> "$GITHUB_STEP_SUMMARY"
